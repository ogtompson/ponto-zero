# Nginx do container web:
#  - entrega o React compilado (pasta /usr/share/nginx/html)
#  - repassa tudo que começa com /api para o container "api" pela rede do Compose
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

    # "api" é o nome do serviço no docker-compose.yml: quem resolve é o DNS interno
    # do Docker (127.0.0.11). Usar variável faz o Nginx consultar o DNS de novo, então
    # se o container da API for reiniciado e mudar de IP, o site continua funcionando.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # arquivos com hash no nome podem ficar em cache por muito tempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # rotas do React (/analises, /infraestrutura...) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /saude {
        access_log off;
        return 200 "ok\n";
    }
}
